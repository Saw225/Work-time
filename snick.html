
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <titlE> أبو تيم</titlE></title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }
        h1 { margin: 10px 0; }
        #score { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        canvas {
            border: 4px solid #ecf0f1;
            background-color: #000;
            max-width: 95vw;
            max-height: 55vh;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px);
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:active { background-color: #7f8c8d; transform: translateY(2px); }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <h1>ابو تيم</h1></h1>
    <div id="score">النقاط: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        <button class="btn btn-up" onclick="changeDirection('UP')">▲</button>
        <button class="btn btn-left" onclick="changeDirection('LEFT')">◄</button>
        <button class="btn btn-down" onclick="changeDirection('DOWN')">▼</button>
        <button class="btn btn-right" onclick="changeDirection('RIGHT')">►</button>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    const grid = 20;
    let count = 0;
    let score = 0;
    let gameSpeed = 6;
    let framesPerStep = gameSpeed;

    let snake = {
        x: 160,
        y: 160,
        dx: grid,
        dy: 0,
        cells: [],
        maxCells: 4
    };

    const fruitColors = ['red', 'orange', 'purple', 'yellow', 'cyan', 'magenta'];
    const fruits = []; 

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min)) + min;
    }

    function getRandomColor() {
        return fruitColors[getRandomInt(0, fruitColors.length)];
    }

    function createFruit() {
        return {
            x: getRandomInt(0, canvas.width / grid) * grid,
            y: getRandomInt(0, canvas.height / grid) * grid,
            color: getRandomColor()
        };
    }

    function initFruits() {
        fruits.length = 0;
        for (let i = 0; i < 5; i++) {
            fruits.push(createFruit());
        }
    }

    function changeDirection(dir) {
        if (dir === 'UP' && snake.dy === 0) {
            snake.dx = 0; snake.dy = -grid;
        } else if (dir === 'DOWN' && snake.dy === 0) {
            snake.dx = 0; snake.dy = grid;
        } else if (dir === 'LEFT' && snake.dx === 0) {
            snake.dx = grid; snake.dy = 0;
        } else if (dir === 'RIGHT' && snake.dx === 0) {
            snake.dx = -grid; snake.dy = 0;
        }
    }

    function resetGame() {
        snake.x = 160;
        snake.y = 160;
        snake.cells = [];
        snake.maxCells = 4;
        snake.dx = grid;
        snake.dy = 0;
        score = 0;
        gameSpeed = 6;
        framesPerStep = gameSpeed;
        scoreElement.innerText = "النقاط: " + score;
        initFruits();
    }

    function loop() {
        requestAnimationFrame(loop);

        if (++count < framesPerStep) return;
        count = 0;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        snake.x += snake.dx;
        snake.y += snake.dy;

        if (snake.x < 0) {
            snake.x = canvas.width - grid;
        } else if (snake.x >= canvas.width) {
            snake.x = 0;
        }

        if (snake.y < 0) {
            snake.y = canvas.height - grid;
        } else if (snake.y >= canvas.height) {
            snake.y = 0;
        }

        snake.cells.unshift({x: snake.x, y: snake.y});
        if (snake.cells.length > snake.maxCells) snake.cells.pop();

        fruits.forEach(function(fruit) {
            ctx.fillStyle = fruit.color;
            ctx.fillRect(fruit.x, fruit.y, grid - 1, grid - 1);
        });

        snake.cells.forEach(function(cell, index) {
            if (index === 0) {
                ctx.fillStyle = 'yellow';
            } else {
                ctx.fillStyle = 'green';
            }
            ctx.fillRect(cell.x, cell.y, grid - 1, grid - 1);

            fruits.forEach(function(fruit, fruitIndex) {
                if (cell.x === fruit.x && cell.y === fruit.y) {
                    snake.maxCells++;
                    score += 10;
                    scoreElement.innerText = "النقاط: " + score;
                    
                    if (gameSpeed > 2 && score % 50 === 0) {
                        gameSpeed--;
                    }
                    framesPerStep = gameSpeed;

                    fruits[fruitIndex] = createFruit();
                }
            });

            for (let i = index + 1; i < snake.cells.length; i++) {
                if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                    resetGame();
                }
            }
        });
    }

    document.addEventListener('keydown', function(e) {
        if (e.which === 37) changeDirection('LEFT');
        else if (e.which === 38) changeDirection('UP');
        else if (e.which === 39) changeDirection('RIGHT');
        else if (e.which === 40) changeDirection('DOWN');
    });

    initFruits();
    requestAnimationFrame(loop);
</script>

</body>
</html>
